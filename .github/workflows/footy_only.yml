name: MABES FootyStream (ISOLATED)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  debug_footy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          echo "Memasang amunisi KHUSUS FootyStream..."
          pip install playwright selectolax
          python -m playwright install --with-deps chromium
          # Instal Monitor Virtual
          sudo apt-get install -y xvfb

      - name: Run FootyStream Debugger (Headed Mode)
        run: |
          echo "🚀 Menjalankan Operasi Penyadapan dengan Layar Virtual (Xvfb)..."
          # Mengeksekusi Python di dalam monitor virtual beresolusi 1280x1024
          xvfb-run --auto-servernum --server-args="-screen 0 1280x1024x24" python debug_footy.py
