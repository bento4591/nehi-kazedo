name: MABES FootyStream (ISOLATED)

on:
  workflow_dispatch: # Pemicu manual khusus dari Kapten

permissions:
  contents: write

jobs:
  debug_footy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          echo "Memasang amunisi KHUSUS FootyStream..."
          pip install playwright selectolax playwright-stealth
          python -m playwright install --with-deps chromium

      - name: Run FootyStream Debugger
        run: |
          echo "🚀 Menjalankan Operasi Penyadapan Cloudflare (Playerdee)..."
          python debug_footy.py
