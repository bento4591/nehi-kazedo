name: MABES FootyStream Debugger

on:
  workflow_dispatch: # Pemicu manual khusus dari Kapten

jobs:
  investigasi_pogo:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          echo "Memasang amunisi investigasi..."
          pip install playwright selectolax
          python -m playwright install --with-deps chromium

      - name: Run FootyStream Debugger
        run: |
          echo "🚀 Memulai Operasi Penyadapan Cloudflare (Playerdee)..."
          python debug_footy.py
